spring.application.name=srms-api
server.port=8090

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/school_system
spring.datasource.username=postgres
spring.datasource.password=11111111
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# This is a pure REST API (no server-rendered views) — keeping the Hibernate session/connection
# open for the whole request past the point of actually needing the DB just wastes pool capacity.
spring.jpa.open-in-view=false
# Batch bulk writes (teacher/subject import, promotions, etc.) into fewer round-trips instead of
# one INSERT/UPDATE per row.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT
jwt.secret=srms-production-secret-key-minimum-256-bits-long-change-in-prod
jwt.expiration=86400000

# CORS - allow frontend
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4173,http://localhost:8080,http://localhost:8081,http://localhost:8082

# System admin bootstrap — only used if admin@srms.zm does not exist yet
# Override via environment variables: APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD
app.admin.email=admin@srms.zm
app.admin.password=Admin@SRMS2024!

# Email (SMTP) — set these to enable email channel
# Example: Gmail → host=smtp.gmail.com port=587 + app password
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:noreply@srms.zm}

# Zamtel BulkSMS — set ZAMTEL_BULKSMS_API_KEY to enable the SMS channel on announcements/broadcasts.
zamtel.bulksms.base-url=${ZAMTEL_BULKSMS_BASE_URL:https://bulksms.zamtel.co.zm/api}
zamtel.bulksms.api-key=${ZAMTEL_BULKSMS_API_KEY:}
zamtel.bulksms.sender-id=${ZAMTEL_BULKSMS_SENDER_ID:DCL}

# ZynlePay payment gateway — set the three ZYNLEPAY_* vars below to enable card payments.
# Sandbox base URLs are the defaults; point ZYNLEPAY_BASE_URL/ZYNLEPAY_PAYMENT_STATUS_URL at
# production when you're ready to go live.
zynlepay.baseUrl=${ZYNLEPAY_BASE_URL:https://sandbox.zynlepay.com/zynlepay/jsonapi}
zynlepay.paymentStatusUrl=${ZYNLEPAY_PAYMENT_STATUS_URL:https://sandbox.zynlepay.com/zynlepay/jsonapi/paymentstatus}
zynlepay.merchantId=${ZYNLEPAY_MERCHANT_ID:}
zynlepay.apiId=${ZYNLEPAY_API_ID:}
zynlepay.apiKey=${ZYNLEPAY_API_KEY:}

# Backups — tenant-scoped exports (see BackupService), not raw pg_dump
app.backup.storage-dir=${BACKUP_STORAGE_DIR:./backups}
app.backup.retention-count=14

# Logging
logging.level.com.srms=INFO

# Actuator — only ever expose "health" (never env/beans/configprops/etc.),
# since /actuator/** is permitAll at the security layer (see SecurityConfig).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
