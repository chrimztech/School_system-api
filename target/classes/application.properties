spring.application.name=srms-api
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/school_system
spring.datasource.username=postgres
spring.datasource.password=11111111
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=srms-production-secret-key-minimum-256-bits-long-change-in-prod
jwt.expiration=86400000

# CORS - allow frontend
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4173,http://localhost:8081,http://localhost:8082

# System admin bootstrap — only used if admin@srms.zm does not exist yet
# Override via environment variables: APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD
app.admin.email=admin@srms.zm
app.admin.password=Admin@SRMS2024!

# Email (SMTP) — set these to enable email channel
# Example: Gmail → host=smtp.gmail.com port=587 + app password
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:noreply@srms.zm}

# Africa's Talking (SMS / WhatsApp) — set to enable SMS channel
# Sandbox: username=sandbox, apiKey=<your AT sandbox key>
africastalking.username=${AT_USERNAME:sandbox}
africastalking.apiKey=${AT_API_KEY:}
africastalking.smsUrl=https://api.africastalking.com/version1/messaging
africastalking.defaultCountryCode=+260

# Logging
logging.level.com.srms=INFO
