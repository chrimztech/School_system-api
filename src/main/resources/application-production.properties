# ============================================================================
# PRODUCTION PROFILE
# Activate by setting the environment variable: SPRING_PROFILES_ACTIVE=production
# (e.g. `SPRING_PROFILES_ACTIVE=production java -jar srms-api.jar`)
#
# Every value below is sourced from an environment variable. The
# security-sensitive ones (DB password, JWT secret, admin password, CORS
# origins) have NO fallback on purpose — if you forget to set one, the app
# will fail to start with a clear "could not resolve placeholder" error
# instead of silently running with an insecure default. See
# .env.production.example for the full list with descriptions.
# ============================================================================

spring.application.name=srms-api

# --- Database ---
# DATABASE_URL must be the full JDBC URL, e.g. jdbc:postgresql://host:5432/dbname
# (NOT the postgres:// connection-string format some hosts show you by default —
# convert it first: postgres://user:pass@host:5432/db -> jdbc:postgresql://host:5432/db,
# with user/pass supplied separately below).
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# --- JPA / Hibernate ---
# NOTE: this project has no Flyway/Liquibase migrations. ddl-auto=update
# auto-evolves the schema additively (new tables/columns) on every boot,
# which is convenient but has no rollback path and can't do destructive
# changes safely. Fine to ship with today; introduce real migrations before
# this becomes a team of more than one person touching the schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Server ---
server.port=${PORT:8080}
# Correctly detect scheme/host when running behind a reverse proxy / load balancer.
server.forward-headers-strategy=framework
server.compression.enabled=true
# Never leak exception details/stack traces to API responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
# Comma-separated, no trailing slashes, e.g.:
# https://app.yourschool.com,https://yourschool.pages.dev
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- System admin bootstrap ---
# Used only on first boot against an empty database. Pick a strong password
# via env var — do NOT reuse the default from application.properties.
# Log in and change it (or rotate it) immediately after first deploy.
app.admin.email=${APP_ADMIN_EMAIL}
app.admin.password=${APP_ADMIN_PASSWORD}

# --- Email (SMTP) ---
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM}

# --- Africa's Talking (SMS / WhatsApp) ---
africastalking.username=${AT_USERNAME}
africastalking.apiKey=${AT_API_KEY}
africastalking.smsUrl=https://api.africastalking.com/version1/messaging
africastalking.defaultCountryCode=${AT_COUNTRY_CODE:+260}

# --- ZynlePay payment gateway ---
# Base URLs default to production; override only if ZynlePay gives you different endpoints.
# Credentials have NO fallback — payment credentials must be explicit, not silently blank.
zynlepay.baseUrl=${ZYNLEPAY_BASE_URL:https://payments.zynlepay.com/zynlepay/jsonapi/}
zynlepay.paymentStatusUrl=${ZYNLEPAY_PAYMENT_STATUS_URL:https://payments.zynlepay.com/zynlepay/paymentstatus}
zynlepay.merchantId=${ZYNLEPAY_MERCHANT_ID}
zynlepay.apiId=${ZYNLEPAY_API_ID}
zynlepay.apiKey=${ZYNLEPAY_API_KEY}

# --- Logging ---
logging.level.root=WARN
logging.level.com.srms=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# --- Actuator ---
# Only "health" is exposed — /actuator/** is permitAll at the security layer
# (see SecurityConfig), so anything more (env, beans, configprops, heapdump)
# would be a public information leak. Do not widen this without adding auth
# in front of /actuator/** first.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
